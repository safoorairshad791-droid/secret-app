<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#7c5cff">

    <title>Secret ✦</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- APP HEADER -->
    <header class="app-header">

        <div>
            <h1>SECRET ✦</h1>
            <p>Focus. Learn. Improve.</p>
        </div>

        <button class="profile-btn" onclick="openSettings()">
            ⚙️
        </button>

    </header>


    <!-- MAIN APP -->
    <main>

        <!-- LEVEL CARD -->
        <section class="level-card">

            <div class="level-top">

                <div>
                    <span class="small-label">YOUR LEVEL</span>
                    <h2>Level <span id="level">1</span></h2>
                </div>

                <div class="xp-number">
                    ⭐ <span id="xp">0</span> XP
                </div>

            </div>

            <div class="xp-bar">
                <div id="xpProgress"></div>
            </div>

            <p>
                <span id="xpNeeded">100</span> XP to next level
            </p>

        </section>


        <!-- QUICK STATS -->
        <section class="stats">

            <div class="stat-card">
                <span>🔥</span>
                <strong id="streak">0</strong>
                <small>Streak</small>
            </div>

            <div class="stat-card">
                <span>🎯</span>
                <strong id="sessions">0</strong>
                <small>Sessions</small>
            </div>

            <div class="stat-card">
                <span>🧠</span>
                <strong id="games">0</strong>
                <small>Games</small>
            </div>

        </section>


        <!-- TODAY -->
        <section class="today-card">

            <div class="section-heading">

                <div>
                    <span class="small-label">TODAY</span>
                    <h2>Your Daily Goal</h2>
                </div>

                <span class="goal-icon">⚡</span>

            </div>

            <p>
                Complete your activities and keep your streak alive.
            </p>

            <div class="goal-progress">
                <div id="dailyProgress"></div>
            </div>

            <span id="dailyText">0 of 3 completed</span>

        </section>


        <!-- FEATURES -->
        <section class="features">

            <h2>Explore Secret</h2>


            <button class="feature-card" onclick="openFocus()">

                <span class="feature-icon">🎯</span>

                <div>
                    <strong>Focus</strong>
                    <small>Study without distractions</small>
                </div>

                <span class="arrow">›</span>

            </button>


            <button class="feature-card" onclick="openGames()">

                <span class="feature-icon">🧠</span>

                <div>
                    <strong>Mind Games</strong>
                    <small>Train your brain</small>
                </div>

                <span class="arrow">›</span>

            </button>


            <button class="feature-card" onclick="openQuiz()">

                <span class="feature-icon">📚</span>

                <div>
                    <strong>Quiz</strong>
                    <small>Test your knowledge</small>
                </div>

                <span class="arrow">›</span>

            </button>


            <button class="feature-card" onclick="openChallenge()">

                <span class="feature-icon">⚡</span>

                <div>
                    <strong>Challenges</strong>
                    <small>Complete daily challenges</small>
                </div>

                <span class="arrow">›</span>

            </button>


            <button class="feature-card" onclick="openPlanner()">

                <span class="feature-icon">📅</span>

                <div>
                    <strong>Study Planner</strong>
                    <small>Plan your study time</small>
                </div>

                <span class="arrow">›</span>

            </button>


            <button class="feature-card" onclick="openProgress()">

                <span class="feature-icon">📊</span>

                <div>
                    <strong>Progress</strong>
                    <small>See your improvement</small>
                </div>

                <span class="arrow">›</span>

            </button>

        </section>


        <!-- CONTENT AREA -->
        <section id="content">

            <h2>🚀 Ready?</h2>

            <p>
                Choose something above and start improving.
            </p>

        </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button onclick="goHome()">
            🏠
            <span>Home</span>
        </button>

        <button onclick="openFocus()">
            🎯
            <span>Focus</span>
        </button>

        <button onclick="openQuiz()">
            📚
            <span>Quiz</span>
        </button>

        <button onclick="openProgress()">
            📊
            <span>Progress</span>
        </button>

    </nav>


    <script src="app.js"></script>

</body>

    </html>
