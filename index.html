
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>SECRET ✦</h1>
        <p>Improve 1% every day.</p>
    </header>

    <main>

        <section class="stats">

            <div>
                <strong id="streak">🔥 0</strong>
                <span>Streak</span>
            </div>

            <div>
                <strong id="xp">⭐ 0</strong>
                <span>XP</span>
            </div>

        </section>

        <section class="menu">

            <button onclick="openFocus()">
                🎯
                <strong>Focus</strong>
                <small>Concentrate without distractions</small>
            </button>

            <button onclick="openGames()">
                🧠
                <strong>Mind Games</strong>
                <small>Train your brain</small>
            </button>

            <button onclick="openQuiz()">
                📚
                <strong>Quiz</strong>
                <small>Test your knowledge</small>
            </button>

            <button onclick="openChallenge()">
                ⚡
                <strong>Daily Challenge</strong>
                <small>Improve every day</small>
            </button>

        </section>

        <section id="content">

            <h2>Welcome 👋</h2>

            <p>Choose an activity and start improving.</p>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
